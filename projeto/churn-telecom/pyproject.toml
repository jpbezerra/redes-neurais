[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-telecom"
version = "0.1.0"
description = "Projeto final - previsao de churn em telecom (CIFAR/UFPE)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "optuna",
    "matplotlib",
    "seaborn",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]
