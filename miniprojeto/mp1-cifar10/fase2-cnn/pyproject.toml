[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnn-cifar10"
version = "0.1.0"
description = "Mini-projeto 1 (Fase 2): CNN para classificação de imagens do CIFAR-10"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "scikit-learn",
    "numpy",
    "pandas",
    "matplotlib",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
